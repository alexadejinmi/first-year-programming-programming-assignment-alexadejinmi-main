<h1>How p5 works</h1>
<p>No new p5 mechanics — the <code>Ball</code> class is entirely student-defined JavaScript. p5 doesn't know or
care that <code>display()</code> exists; it's just a method that happens to call p5's drawing functions
inside it, exactly as <code>displayBall()</code> did.</p>
